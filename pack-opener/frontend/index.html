<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pack Opener</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="topbar">
            <p class="eyebrow">ASHΛ // ITEM SHOP</p>
            <div class="points-display">
                <span class="points-icon">◆</span>
                <strong id="points-value">10000000 200</strong>
                <span>PTS</span>
            </div>
            <div id="profile-menu" class="profile-menu" hidden>
                <span id="profile-email"></span>
                <button id="profile-logout" type="button" aria-label="Se déconnecter">↪</button>
            </div>
        </div>
        <h1 id="page-title">OUVRIR DES PACKS</h1>
        <p id="page-tagline" class="tagline">Révèle les cartes de ton prochain drop.</p>

        <nav class="main-navigation" aria-label="Navigation principale">
            <button class="nav-button active" type="button" data-view="packs">Ouvrir des packs</button>
            <button class="nav-button" type="button" data-view="shop">Boutique</button>
            <button class="nav-button" type="button" data-view="collection">Collection</button>
        </nav>

        <section id="account-panel" class="account-panel" aria-labelledby="account-title">
            <div>
                <p class="section-kicker">COMPTE</p>
                <h2 id="account-title">Sauvegarde ta collection</h2>
            </div>
            <form id="auth-form">
                <input id="auth-email" type="email" placeholder="Email" autocomplete="email" required>
                <input id="auth-password" type="password" placeholder="Mot de passe (6 caractères minimum)" minlength="6" autocomplete="current-password" required>
                <button type="submit">Se connecter</button>
                <button id="register-button" type="button">Créer un compte</button>
            </form>
            <p id="auth-status" role="status"></p>
            <button id="logout-button" type="button" hidden>Se déconnecter</button>
        </section>
    </header>


    <main>

        <section class="shop-section app-view" data-view-panel="shop" aria-labelledby="shop-title" hidden>
            <div class="shop-heading">
                <div>
                    <p class="section-kicker">BOUTIQUE</p>
                    <h2 id="shop-title">Cartes disponibles</h2>
                </div>
                <span class="shop-timer">STOCK DE CARTES // AUJOURD'HUI</span>
            </div>

            <div id="booster-shop" class="booster-grid"></div>
        </section>

        <section class="pack-section app-view active" data-view-panel="packs" aria-labelledby="page-title">

            <div id="pack-container" class="pack-container">
                <div class="pack-placeholder">
                    <span class="pack-clip"></span>
                    <p class="pack-label">ASHΛ // SERIES 01</p>
                    <img class="pack-logo" src="asha-logo.png" alt="ASHΛ">
                    <span class="pack-edition">UNDERGROUND PACK</span>
                    <p class="pack-hint">Ouvre un pack</p>
                </div>
            </div>

            <button id="open-pack-btn" type="button">
                OUVRIR UN BOOSTER
            </button>

            <p id="status"></p>

        </section>


        <section class="collection-section app-view" data-view-panel="collection" aria-labelledby="collection-title" hidden>

            <div class="section-title">
                <h2 id="collection-title">Collection</h2>

                <button id="refresh-collection">
                    Actualiser
                </button>
            </div>

            <div id="collection-container" class="collection-container">
                <p class="empty">
                    Aucune carte dans ta collection.
                </p>
            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
